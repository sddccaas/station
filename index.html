<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hearts Stream — by Hearts Store</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #ffeff3; --bg2: #ffcad4; --border: #ff8fab; --accent: #ff4d6d;
  --text: #a4133c; --muted: #c9184a; --card: #ffffff;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);overflow-x:hidden;}
header{position:fixed;top:0;width:100%;height:75px;background:rgba(255,239,243,0.95);display:flex;align-items:center;justify-content:space-between;padding:0 40px;border-bottom:2px solid var(--border);z-index:1000;backdrop-filter:blur(10px);}
.logo{font-family:'Bebas Neue',sans-serif;font-size:32px;color:var(--accent);}
.search-bar{background:var(--card);border:2px solid var(--border);border-radius:30px;padding:8px 18px;width:300px;}
.search-bar input{background:none;border:none;outline:none;color:var(--text);width:100%;}
#hero{margin-top:75px;height:400px;background-size:cover;background-position:center;display:flex;align-items:flex-end;position:relative;}
#hero::after{content:'';position:absolute;inset:0;background:linear-gradient(to top,var(--bg),transparent);}
.hero-content{position:relative;z-index:2;padding:40px;max-width:600px;}
.section{padding:30px 40px;}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:20px;}
.card{background:var(--card);border-radius:15px;overflow:hidden;border:2px solid var(--bg2);cursor:pointer;transition:0.3s;}
.card:hover{transform:translateY(-5px);border-color:var(--accent);}
.card img{width:100%;aspect-ratio:2/3;object-fit:cover;}
.card-body{padding:10px;text-align:center;font-weight:700;font-size:13px;}
#player-modal{position:fixed;inset:0;z-index:3000;background:rgba(0,0,0,0.9);display:none;flex-direction:column;}
.player-header{padding:15px;background:var(--bg2);display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid var(--border);}
video{flex:1;width:100%;background:#000;}
.btn-pink{background:var(--accent);color:#fff;border:none;padding:10px 20px;border-radius:8px;cursor:pointer;font-weight:bold;text-transform:uppercase;}
.loading-box{grid-column:1/-1;text-align:center;padding:50px;}
.spinner{width:40px;height:40px;border:4px solid var(--bg2);border-top-color:var(--accent);border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 15px;}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<header>
  <div class="logo">HEARTS<span>STREAM</span></div>
  <div class="search-bar"><input type="text" id="search-input" placeholder="Buscar filmes e séries..."></div>
  <div style="font-weight:bold; color:var(--accent); font-size:12px;">by Hearts Store</div>
</header>

<section id="hero">
  <div class="hero-content"><h1 id="hero-title" style="font-family:'Bebas Neue'; font-size:50px; color:var(--accent);">Hearts Stream</h1></div>
</section>

<div class="section">
  <h2 style="margin-bottom:20px; font-family:'Bebas Neue'; letter-spacing:1px;">LANÇAMENTOS <span>HEARTS</span></h2>
  <div class="grid" id="main-grid">
    <div class="loading-box" id="loading-status">
        <div class="spinner"></div>
        <p>Conectando ao catálogo...</p>
        <button class="btn-pink" style="margin-top:20px;" onclick="window.open('https://cors-anywhere.herokuapp.com/corsdemo', '_blank')">Ativar Conexão</button>
    </div>
  </div>
</div>

<div id="player-modal">
  <div class="player-header">
    <div id="player-title" style="font-weight:bold;"></div>
    <button class="btn-pink" onclick="closePlayer()">FECHAR X</button>
  </div>
  <video id="main-video" controls autoplay></video>
</div>

<script>
const XC = { host: 'http://ctdg.me', user: '87148066', pass: '18310678' };
const PROXY = "https://cors-anywhere.herokuapp.com/";

async function loadContent() {
    const url = `${XC.host}/player_api.php?username=${XC.user}&password=${XC.pass}&action=get_vod_streams`;
    try {
        const r = await fetch(PROXY + url);
        const data = await r.json();
        if(data) renderGrid(data.slice(0, 60));
    } catch (e) {
        document.getElementById('loading-status').innerHTML = `
            <p style="color:red; font-weight:bold;">ERRO DE CONEXÃO HTTPS</p>
            <p style="font-size:13px; margin:10px 0;">Clique no botão abaixo, ative o acesso e dê F5 aqui.</p>
            <button class="btn-pink" onclick="window.open('https://cors-anywhere.herokuapp.com/corsdemo', '_blank')">LIBERAR ACESSO</button>
        `;
    }
}

function renderGrid(items) {
    const grid = document.getElementById('main-grid');
    grid.innerHTML = items.map(item => `
        <div class="card" onclick="openPlayer('${item.name.replace(/'/g, "")}', '${item.stream_id}', '${item.container_extension}')">
            <img src="${item.stream_icon || 'https://via.placeholder.com/160x240/ffcad4/a4133c?text=S/Capa'}">
            <div class="card-body">${item.name}</div>
        </div>
    `).join('');
    if(items[0]) {
        document.getElementById('hero-title').innerText = items[0].name;
        document.getElementById('hero').style.backgroundImage = `url(${items[0].stream_icon})`;
    }
}

function openPlayer(name, id, ext) {
    const modal = document.getElementById('player-modal');
    const video = document.getElementById('main-video');
    const streamUrl = `${XC.host}/movie/${XC.user}/${XC.pass}/${id}.${ext || 'mp4'}`;
    document.getElementById('player-title').innerText = name;
    video.src = streamUrl;
    modal.style.display = 'flex';
    video.play();
}

function closePlayer() {
    const video = document.getElementById('main-video');
    video.pause();
    video.src = "";
    document.getElementById('player-modal').style.display = 'none';
}

loadContent();
</script>
</body>
</html>
