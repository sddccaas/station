<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CineStream</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#07090d;--bg2:#0d1117;--bg3:#141a22;--card:#101620;
  --border:#1c2736;--accent:#e63946;--accent2:#ff6b6b;
  --gold:#f4a261;--text:#e8edf2;--muted:#5a6a7d;--r:10px;
  --live:#00d084;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;}
::-webkit-scrollbar{width:5px;}::-webkit-scrollbar-track{background:var(--bg2);}::-webkit-scrollbar-thumb{background:var(--accent);border-radius:3px;}

/* HEADER */
header{position:fixed;top:0;left:0;right:0;z-index:900;height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 32px;background:rgba(7,9,13,.97);backdrop-filter:blur(16px);border-bottom:1px solid rgba(255,255,255,.04);}
.logo{font-family:'Bebas Neue',sans-serif;font-size:26px;letter-spacing:3px;cursor:pointer;user-select:none;}
.logo em{color:var(--accent);font-style:normal;}
.nav{display:flex;gap:4px;}
.nav-btn{background:none;border:1px solid transparent;color:var(--muted);cursor:pointer;padding:6px 16px;border-radius:20px;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:500;transition:all .18s;display:flex;align-items:center;gap:6px;}
.nav-btn:hover{color:var(--text);border-color:var(--border);}
.nav-btn.active{background:var(--accent);border-color:var(--accent);color:#fff;}
.nav-btn.lbtn.active{background:var(--live);border-color:var(--live);color:#000;font-weight:700;}
.nav-btn.lbtn:hover:not(.active){color:var(--live);border-color:var(--live);}
.srch-bar{display:flex;align-items:center;gap:8px;background:var(--bg3);border:1px solid var(--border);border-radius:24px;padding:7px 16px;width:240px;transition:border-color .2s;}
.srch-bar:focus-within{border-color:var(--accent);}
.srch-bar input{background:none;border:none;outline:none;color:var(--text);font-family:'DM Sans',sans-serif;font-size:13px;width:100%;}
.srch-bar input::placeholder{color:var(--muted);}

/* HERO */
#hero{margin-top:64px;position:relative;height:490px;overflow:hidden;display:flex;align-items:flex-end;}
#hero-bg{position:absolute;inset:0;background-size:cover;background-position:center 20%;transition:all 1.2s ease;}
#hero-bg::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,rgba(7,9,13,.97) 0%,rgba(7,9,13,.55) 55%,rgba(7,9,13,.1) 100%),linear-gradient(to top,rgba(7,9,13,1) 0%,transparent 55%);}
.hero-c{position:relative;z-index:2;padding:38px 46px;max-width:540px;}
.hero-tag{display:inline-block;background:var(--accent);color:#fff;font-size:10px;font-weight:700;letter-spacing:2px;text-transform:uppercase;padding:3px 10px;border-radius:3px;margin-bottom:12px;}
.hero-title{font-family:'Bebas Neue',sans-serif;font-size:56px;line-height:1;margin-bottom:9px;text-shadow:0 2px 16px rgba(0,0,0,.7);}
.hero-meta{display:flex;gap:10px;align-items:center;font-size:12.5px;color:var(--muted);margin-bottom:11px;flex-wrap:wrap;}
.hero-meta .star{color:var(--gold);font-weight:700;}
.hero-desc{font-size:13px;color:#9aabbb;line-height:1.65;margin-bottom:20px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;}
.hero-btns{display:flex;gap:10px;}
.btn-red{display:flex;align-items:center;gap:7px;background:var(--accent);color:#fff;border:none;cursor:pointer;padding:10px 24px;border-radius:7px;font-family:'DM Sans',sans-serif;font-size:13.5px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;transition:all .2s;}
.btn-red:hover{background:var(--accent2);transform:translateY(-1px);}
.btn-ghost{display:flex;align-items:center;gap:7px;background:rgba(255,255,255,.07);color:var(--text);border:1px solid rgba(255,255,255,.11);cursor:pointer;padding:10px 20px;border-radius:7px;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:500;transition:all .2s;}
.btn-ghost:hover{background:rgba(255,255,255,.13);}

/* PAGES */
.page{display:none;flex-direction:column;}
.page.on{display:flex;}
#pg-vod{padding-top:64px;}
#pg-live{padding-top:80px;padding-bottom:40px;}

/* PILLS */
.pill-row{display:flex;gap:7px;flex-wrap:wrap;padding:12px 32px 4px;overflow-x:auto;}
.pill-row::-webkit-scrollbar{height:0;}
.pill{background:var(--bg3);border:1px solid var(--border);color:var(--muted);cursor:pointer;padding:5px 13px;border-radius:15px;font-size:12px;font-weight:500;white-space:nowrap;transition:all .18s;}
.pill:hover{color:var(--text);}
.pill.on{background:var(--accent);border-color:var(--accent);color:#fff;}
.pill.lon{background:var(--live);border-color:var(--live);color:#000;font-weight:700;}
.pill.live-p:hover:not(.on):not(.lon){color:var(--live);border-color:var(--live);}

/* SECTION */
.sec{padding:10px 32px 26px;}
.sec-h{font-family:'Bebas Neue',sans-serif;font-size:19px;letter-spacing:2px;margin-bottom:14px;display:flex;align-items:center;gap:8px;}
.sec-h em{color:var(--accent);font-style:normal;}
.sec-cnt{font-size:11px;color:var(--muted);font-family:'DM Sans',sans-serif;letter-spacing:0;font-weight:400;}

/* VOD GRID */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(144px,1fr));gap:13px;}
.card{background:var(--card);border-radius:var(--r);overflow:hidden;cursor:pointer;transition:transform .22s,box-shadow .22s;border:1px solid var(--border);position:relative;}
.card:hover{transform:translateY(-5px) scale(1.015);box-shadow:0 16px 38px rgba(0,0,0,.7),0 0 0 1px var(--accent);z-index:10;}
.card-img{width:100%;aspect-ratio:2/3;object-fit:cover;display:block;background:var(--bg3);}
.card-body{padding:8px 10px 10px;}
.card-title{font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:3px;}
.card-sub{display:flex;align-items:center;justify-content:space-between;font-size:10.5px;color:var(--muted);}
.card-rating{color:var(--gold);font-weight:700;}
.card-ov{position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.88) 35%,transparent);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;opacity:0;transition:opacity .2s;}
.card:hover .card-ov{opacity:1;}
.play-c{width:46px;height:46px;background:var(--accent);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:19px;box-shadow:0 0 26px rgba(230,57,70,.5);transition:transform .2s;}
.card:hover .play-c{transform:scale(1.08);}
.ov-title{font-size:11.5px;font-weight:600;text-align:center;padding:0 7px;}

/* LIVE GRID */
.lgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:9px;}
.ch{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:11px 13px;cursor:pointer;transition:all .2s;display:flex;align-items:center;gap:11px;position:relative;overflow:hidden;}
.ch::after{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--live);transform:scaleY(0);transition:transform .2s;}
.ch:hover{border-color:rgba(0,208,132,.3);transform:translateY(-2px);box-shadow:0 7px 22px rgba(0,0,0,.5);}
.ch:hover::after{transform:scaleY(1);}
.ch-logo{width:46px;height:46px;object-fit:contain;border-radius:6px;background:var(--bg3);flex-shrink:0;border:1px solid var(--border);}
.ch-ph{width:46px;height:46px;background:var(--bg3);border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0;border:1px solid var(--border);}
.ch-info{flex:1;min-width:0;}
.ch-name{font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:2px;}
.ch-cat{font-size:10.5px;color:var(--muted);}
.ch-arr{font-size:13px;color:var(--live);opacity:0;transition:opacity .2s;flex-shrink:0;}
.ch:hover .ch-arr{opacity:1;}

/* MODAL */
#modal{position:fixed;inset:0;z-index:1800;background:rgba(0,0,0,.9);display:none;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(8px);}
#modal.open{display:flex;}
.mbox{background:var(--bg2);border:1px solid var(--border);border-radius:13px;width:100%;max-width:940px;max-height:90vh;overflow-y:auto;animation:pop .26s ease;}
@keyframes pop{from{opacity:0;transform:scale(.96) translateY(20px)}to{opacity:1;transform:scale(1) translateY(0)}}
.mhero{position:relative;height:290px;overflow:hidden;border-radius:13px 13px 0 0;}
.mhero img.bg{width:100%;height:100%;object-fit:cover;filter:brightness(.42);}
.mhero-g{position:absolute;inset:0;background:linear-gradient(to top,var(--bg2) 5%,transparent 55%);}
.mcls{position:absolute;top:13px;right:13px;background:rgba(0,0,0,.55);border:1px solid var(--border);color:var(--text);cursor:pointer;width:33px;height:33px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:15px;transition:all .2s;z-index:5;}
.mcls:hover{background:var(--accent);border-color:var(--accent);}
.minfo{position:absolute;bottom:0;left:0;right:0;padding:22px 24px;display:flex;gap:18px;align-items:flex-end;}
.mposter{width:95px;height:142px;object-fit:cover;border-radius:7px;border:2px solid var(--border);flex-shrink:0;box-shadow:0 5px 20px rgba(0,0,0,.6);}
.mtitle{font-family:'Bebas Neue',sans-serif;font-size:36px;line-height:1;margin-bottom:6px;}
.mmeta{display:flex;gap:10px;align-items:center;font-size:12px;color:var(--muted);flex-wrap:wrap;}
.mmeta .star{color:var(--gold);font-weight:700;font-size:13px;}
.mbody{padding:18px 24px 24px;}
.mdesc{font-size:13px;color:#9aabbb;line-height:1.7;margin-bottom:20px;}
.shd{font-family:'Bebas Neue',sans-serif;font-size:16px;letter-spacing:1px;margin-bottom:9px;}
.stabs{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:12px;}
.stab{background:var(--bg3);border:1px solid var(--border);color:var(--muted);cursor:pointer;padding:5px 13px;border-radius:6px;font-size:12px;font-weight:500;font-family:'DM Sans',sans-serif;transition:all .18s;}
.stab.on,.stab:hover{background:var(--accent);border-color:var(--accent);color:#fff;}
.egrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:7px;}
.ep{background:var(--bg3);border:1px solid var(--border);border-radius:7px;padding:9px 12px;cursor:pointer;transition:all .18s;display:flex;align-items:center;gap:9px;}
.ep:hover{background:var(--accent);border-color:var(--accent);}
.epn{font-family:'Bebas Neue',sans-serif;font-size:19px;color:var(--muted);min-width:22px;}
.ep:hover .epn{color:rgba(255,255,255,.55);}
.ept{flex:1;min-width:0;}
.epname{font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.epdate{font-size:10.5px;color:var(--muted);margin-top:2px;}
.ep:hover .epdate{color:rgba(255,255,255,.6);}

/* PLAYER */
#player{position:fixed;inset:0;z-index:2000;background:#000;display:none;flex-direction:column;}
#player.open{display:flex;}
.ph{display:flex;align-items:center;justify-content:space-between;padding:8px 18px;background:var(--bg2);border-bottom:1px solid var(--border);flex-shrink:0;gap:8px;flex-wrap:wrap;}
.plogo{font-family:'Bebas Neue',sans-serif;font-size:17px;letter-spacing:2px;}
.plogo em{color:var(--accent);font-style:normal;}
.ptitle{font-size:12.5px;color:var(--muted);}
.pcls{background:var(--accent);border:none;color:#fff;cursor:pointer;padding:7px 16px;border-radius:6px;font-family:'DM Sans',sans-serif;font-weight:700;font-size:12px;}
.pcls:hover{background:var(--accent2);}
.psrv{background:var(--bg2);border-bottom:1px solid var(--border);padding:6px 18px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;flex-shrink:0;}
.pslabel{font-size:10px;color:var(--muted);font-weight:700;letter-spacing:1px;text-transform:uppercase;white-space:nowrap;}
.sbtns{display:flex;gap:5px;flex-wrap:wrap;}
.sbtn{background:var(--bg3);border:1px solid var(--border);color:var(--muted);cursor:pointer;padding:4px 12px;border-radius:15px;font-family:'DM Sans',sans-serif;font-size:11px;font-weight:600;transition:all .18s;}
.sbtn.on{background:var(--accent);border-color:var(--accent);color:#fff;}
.sbtn:hover:not(.on){border-color:var(--accent);color:var(--text);}
.sbtn.pt{border-left:3px solid #00a86b;}
.sbtn.lon{background:var(--live);border-color:var(--live);color:#000;}
.sbtn.live-s:hover:not(.on):not(.lon){border-color:var(--live);color:var(--live);}
.pbody{flex:1;position:relative;background:#000;}
#pframe{position:absolute;inset:0;width:100%;height:100%;border:none;background:#000;}
.ploading{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:var(--muted);background:#000;z-index:2;transition:opacity .5s;}
.ploading.gone{opacity:0;pointer-events:none;}
.ptip{font-size:11.5px;color:var(--muted);text-align:center;padding:0 18px;max-width:360px;line-height:1.5;margin-top:3px;}

/* UTIL */
.spin{width:38px;height:38px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:rot .8s linear infinite;}
.spin.lg{width:48px;height:48px;border-width:4px;}
.spin.g{border-top-color:var(--live);}
@keyframes rot{to{transform:rotate(360deg)}}
.loader{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:65px 20px;gap:13px;color:var(--muted);}
.empty{text-align:center;padding:55px 20px;color:var(--muted);font-size:13.5px;}
.ldot{width:7px;height:7px;background:currentColor;border-radius:50%;animation:blink 1s infinite;display:inline-block;}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
footer{text-align:center;padding:22px;color:var(--muted);font-size:11px;border-top:1px solid var(--border);}
footer em{color:var(--accent);font-style:normal;}

@media(max-width:768px){
  header{padding:0 12px;}
  .srch-bar{width:120px;}
  .nav-btn span:last-child{display:none;}
  #hero{height:300px;}
  .hero-c{padding:14px;}
  .hero-title{font-size:34px;}
  .sec{padding:8px 12px 20px;}
  .pill-row{padding:8px 12px 2px;}
  .grid{grid-template-columns:repeat(auto-fill,minmax(106px,1fr));gap:9px;}
  .lgrid{grid-template-columns:1fr 1fr;}
  .mhero{height:170px;}
  .minfo{padding:10px 13px;}
  .mposter{width:56px;height:84px;}
  .mtitle{font-size:22px;}
  .mbody{padding:11px 13px;}
  .egrid{grid-template-columns:1fr 1fr;}
  #pg-live{padding-top:70px;}
}
</style>
</head>

<!-- LIVE PAGE -->
<div class="page" id="pg-live">

    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:10px;">
      <h2 class="sec-h" style="margin:0">
        <span style="display:inline-flex;align-items:center;gap:5px;background:var(--live);color:#000;font-size:10px;font-family:'DM Sans',sans-serif;font-weight:800;letter-spacing:2px;padding:3px 9px;border-radius:3px;text-transform:uppercase;margin-right:6px;">
          <span class="ldot"></span>AO VIVO
        </span>
        CANAIS <em>TV</em> <span class="sec-cnt" id="live-cnt"></span>
      </h2>
      <div class="srch-bar" style="width:190px;">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="color:var(--muted);flex-shrink:0"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        <input type="text" id="lsrch" placeholder="Buscar canal..." autocomplete="off">
      </div>
    </div>
    <div class="lgrid" id="live-grid">
      <div class="loader" style="grid-column:1/-1"><div class="spin g"></div><span>Carregando canais...</span></div>
    </div>
  </div>
</div>

<!-- MODAL -->
<div id="modal">
  <div class="mbox">
    <div class="mhero">
      <img class="bg" id="m-bg" src="" alt="">
      <div class="mhero-g"></div>
      <button class="mcls" onclick="closeModal()">✕</button>

      <p class="mdesc" id="m-desc"></p>

</div>

<!-- PLAYER -->
<div id="player">
  <div class="ph">
    <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
      <div class="plogo">CINE<em>STREAM</em></div>
      <span class="ptitle" id="ptitle"></span>
    </div>
    <button class="pcls" onclick="closePlayer()">✕ Fechar</button>
  </div>
  <div class="psrv" id="psrv"></div>
  <div class="pbody">
    <div class="ploading" id="ploading">
      <div class="spin lg" id="pspin"></div>
      <span id="ploadtxt">Carregando...</span>
      <p class="ptip" id="ptip"></p>
    </div>
    <iframe id="pframe" allowfullscreen allow="autoplay;fullscreen;encrypted-media;picture-in-picture" referrerpolicy="no-referrer"></iframe>
  </div>
</div>

  { n:'SuperEmbed 🇧🇷', pt:1, f:(t,tid,iid,s,e)=> t==='m'?`https://superembed.stream/embed/movie/${tid}?lang=pt`:`https://superembed.stream/embed/series/${tid}/${s}/${e}?lang=pt` },
  { n:'MoviesAPI 🇧🇷', pt:1, f:(t,tid,iid,s,e)=> t==='m'?`https://moviesapi.club/movie/${iid}`:`https://moviesapi.club/tv/${iid}-${s}-${e}` },
  { n:'VidSrc Pro', pt:0, f:(t,tid,iid,s,e)=> t==='m'?`https://vidsrc.pro/embed/movie/${iid}`:`https://vidsrc.pro/embed/tv/${iid}/${s}/${e}` },
  { n:'VidSrc.me', pt:0, f:(t,tid,iid,s,e)=> t==='m'?`https://vidsrc.me/embed/movie?tmdb=${tid}`:`https://vidsrc.me/embed/tv?tmdb=${tid}&season=${s}&episode=${e}` },
  { n:'VidSrc.xyz', pt:0, f:(t,tid,iid,s,e)=> t==='m'?`https://vidsrc.xyz/embed/movie/${tid}`:`https://vidsrc.xyz/embed/tv/${tid}/${s}/${e}` },
  { n:'AutoEmbed', pt:0, f:(t,tid,iid,s,e)=> t==='m'?`https://autoembed.cc/movie/${iid}`:`https://autoembed.cc/tv/${iid}-${s}-${e}` },
  { n:'2Embed', pt:0, f:(t,tid,iid,s,e)=> t==='m'?`https://www.2embed.cc/embed/${iid}`:`https://www.2embed.cc/embedtv/${iid}&s=${s}&e=${e}` },
];

const LIVE_SRVS = [
  { n:'HLS Player', f: u=>`https://www.hlsplayer.org/play?url=${encodeURIComponent(u+'.m3u8')}` },
  { n:'Player 2', f: u=>`https://hls-js.netlify.app/demo/?src=${encodeURIComponent(u+'.m3u8')}` },
  { n:'Stream TS', f: u=>`https://www.hlsplayer.org/play?url=${encodeURIComponent(u+'.ts')}` },
];

/* ══════════════════════════════════════
   ESTADO
══════════════════════════════════════ */
const ST = {
  page:'vod',
  vodType:'movie',
  vodCatId:null,
  vodCats:{movie:[],series:[]},
  vodItems:[],
  heroes:[], hIdx:0, hTimer:null,
  curItem:null, curS:1, curE:1, curSrv:0,
  liveCats:[], liveCatId:null,
  liveChs:[], liveFiltered:[],
  curCh:null,
};

/* ══════════════════════════════════════
   UTILS
══════════════════════════════════════ */
async function xcFetch(action, extra='') {
  try {
    const r = await fetch(xcUrl(action, extra));
    return r.json();
  } catch(e) { return null; }
}

async function tmdbFetch(path, params={}) {
  const u = new URL(`${TMDB_BASE}${path}`);
  u.searchParams.set('api_key', TMDB_KEY);
  u.searchParams.set('language','pt-BR');
  Object.entries(params).forEach(([k,v])=>u.searchParams.set(k,v));
  try { return (await fetch(u)).json(); } catch(e) { return {}; }
}

async function getImdb(tmdbId, type) {
  try {
    const d = await tmdbFetch(`/${type}/${tmdbId}/external_ids`);
    return d.imdb_id||null;
  } catch(e){return null;}
}

function enc(x){ try{return btoa(unescape(encodeURIComponent(JSON.stringify(x))))}catch(e){return '';} }
function dec(s){ try{return JSON.parse(decodeURIComponent(escape(atob(s))))}catch(e){return null;} }

/* ══════════════════════════════════════
   NAVEGAÇÃO
══════════════════════════════════════ */
function switchPage(p) {
  ST.page=p;
  document.getElementById('pg-vod').classList.toggle('on',p==='vod');
  document.getElementById('pg-live').classList.toggle('on',p==='live');
  document.getElementById('nbtn-vod').classList.toggle('on',p==='vod');
  document.getElementById('nbtn-live').classList.toggle('on',p==='live');
  document.getElementById('srch').value='';
  if (p==='live' && !ST.liveChs.length) loadLive();
}

/* ══════════════════════════════════════
   HERO
══════════════════════════════════════ */
function setHero(item) {
  const t = item._td;
  if (!t) return;
  const title = t.title||t.name||item.name||'';
  document.getElementById('hero-bg').style.backgroundImage =
    t.backdrop_path ? `url(${IMG_BASE}original${t.backdrop_path})` : 'none';
  document.getElementById('hero-title').textContent = title;
  document.getElementById('hero-desc').textContent  = t.overview||'';
  document.getElementById('hero-tag').textContent   = item._type==='movie'?'🎬 Filme':'📺 Série';
  document.getElementById('hero-meta').innerHTML =
    `<span class="star">⭐ ${t.vote_average?.toFixed(1)||'?'}</span>
     <span>${(t.release_date||t.first_air_date||'').slice(0,4)}</span>
     <span>${item._type==='movie'?'Filme':'Série'}</span>`;
  document.getElementById('hero-play').onclick = ()=>openVODPlayer(item,1,1,0);
  document.getElementById('hero-info').onclick  = ()=>openModal(item);
}

function startHero() {
  clearInterval(ST.hTimer);
  ST.hTimer = setInterval(()=>{
    ST.hIdx=(ST.hIdx+1)%ST.heroes.length;
    setHero(ST.heroes[ST.hIdx]);
  },7000);
}

async function buildHeroes(items) {
  ST.heroes=[];
  for (const item of items.slice(0,12)) {
    const name = item.name||item.title||'';
    if (!name) continue;
    const d = await tmdbFetch('/search/multi',{query:name});
    const res = (d.results||[]).find(r=>r.media_type==='movie'||r.media_type==='tv');
    if (res?.backdrop_path) { item._td=res; ST.heroes.push(item); }
    if (ST.heroes.length>=6) break;
  }
  if (ST.heroes.length) { ST.hIdx=0; setHero(ST.heroes[0]); startHero(); }
}

/* ══════════════════════════════════════
   VOD — CATS
══════════════════════════════════════ */
async function loadVODCats() {
  const [mv,sr] = await Promise.all([
    xcFetch('get_vod_categories'),
    xcFetch('get_series_categories')
  ]);
  ST.vodCats.movie  = Array.isArray(mv)?mv:[];
  ST.vodCats.series = Array.isArray(sr)?sr:[];
  renderVODCats();
}

function renderVODCats() {
  const cats = ST.vodType==='movie'?ST.vodCats.movie:ST.vodCats.series;
  document.getElementById('vod-cats').innerHTML =
    `<button class="pill${ST.vodType==='movie'?' on':''}" onclick="setVODType('movie')">🎬 Filmes</button>` +
    `<button class="pill${ST.vodType==='series'?' on':''}" onclick="setVODType('series')">📺 Séries</button>` +
    `<span style="width:1px;background:var(--border);margin:0 4px;align-self:stretch;display:inline-block;"></span>` +
    cats.map(c=>
      `<button class="pill${ST.vodCatId===c.category_id?' on':''}"
        onclick="setVODCat('${c.category_id}')">${c.category_name}</button>`
    ).join('');
}

function setVODType(t){
  ST.vodType=t; ST.vodCatId=null;
  renderVODCats(); loadVODItems();
}
function setVODCat(id){
  ST.vodCatId = ST.vodCatId===id?null:id;
  renderVODCats(); loadVODItems();
}

/* ══════════════════════════════════════
   VOD — ITEMS
══════════════════════════════════════ */
async function loadVODItems(search='') {
  const grid=document.getElementById('vod-grid');
  grid.innerHTML='<div class="loader" style="grid-column:1/-1"><div class="spin"></div><span>Carregando...</span></div>';

  let items=[];
  if (search) {
    const [mv,sr] = await Promise.all([
      xcFetch('search_vod',`&search_tag=${encodeURIComponent(search)}`),
      xcFetch('search_series',`&search_tag=${encodeURIComponent(search)}`)
    ]);
    const a=(Array.isArray(mv)?mv:[]).map(x=>({...x,_type:'movie'}));
    const b=(Array.isArray(sr)?sr:[]).map(x=>({...x,_type:'series'}));
    items=[...a,...b].sort((x,y)=>(y.rating_5based||0)-(x.rating_5based||0));
    document.getElementById('vod-h').innerHTML=`BUSCA <em>"${search.slice(0,20).toUpperCase()}"</em>`;
  } else {
    const action=ST.vodType==='movie'?'get_vod_streams':'get_series';
    const extra=ST.vodCatId?`&category_id=${ST.vodCatId}`:'';
    const raw=await xcFetch(action,extra);
    items=(Array.isArray(raw)?raw:[]).map(x=>({...x,_type:ST.vodType}));
    document.getElementById('vod-h').innerHTML=
      ST.vodType==='movie'?`FILMES <em>DO SERVIDOR</em>`:`SÉRIES <em>DO SERVIDOR</em>`;
  }

  ST.vodItems=items;
  document.getElementById('vod-cnt').textContent=items.length?`(${items.length})`:'';
  renderVODGrid(items);
  if (!search) buildHeroes(items.filter(x=>x.stream_icon||x.cover).slice(0,20));
}

function renderVODGrid(items) {
  const grid=document.getElementById('vod-grid');
  if (!items.length){grid.innerHTML='<div class="empty" style="grid-column:1/-1">Nenhum item encontrado.</div>';return;}
  grid.innerHTML=items.slice(0,80).map(item=>{
    const title=item.name||item.title||'';
    const cover=item.stream_icon||item.cover||item.cover_big||'';
    const poster=cover||'https://placehold.co/144x216/101620/5a6a7d?text=S/Capa';
    const rating=item.rating_5based?(item.rating_5based*2).toFixed(1):(item.rating||'');
    const year=(item.year||item.releaseDate||'').toString().slice(0,4);
    return `<div class="card" onclick="openModal('${enc(item)}')">
      <img class="card-img" src="${poster}" alt="${title}" loading="lazy"
        onerror="this.src='https://placehold.co/144x216/101620/5a6a7d?text=S/Capa'">
      <div class="card-ov">
        <div class="play-c">▶</div>
        <div class="ov-title">${title}</div>
      </div>
      <div class="card-body">
        <div class="card-title">${title}</div>
        <div class="card-sub">
          <span>${year}</span>
          ${rating?`<span class="card-rating">⭐ ${rating}</span>`:''}
        </div>
      </div>
    </div>`;
  }).join('');
}

/* ══════════════════════════════════════
   MODAL
══════════════════════════════════════ */
async function openModal(src) {
  const item=typeof src==='string'?dec(src):src;
  if(!item)return;
  ST.curItem=item;
  const isM=item._type==='movie';
  const title=item.name||item.title||'';
  const cover=item.stream_icon||item.cover||item.cover_big||'';

  // TMDB lookup
  if (!item._td && title) {
    const d=await tmdbFetch('/search/multi',{query:title});
    item._td=(d.results||[]).find(r=>r.media_type==='movie'||r.media_type==='tv')||null;
  }
  const td=item._td;
  const poster=td?.poster_path?`${IMG_BASE}w342${td.poster_path}`:cover||'https://placehold.co/95x142/101620/5a6a7d?text=S/P';
  const back  =td?.backdrop_path?`${IMG_BASE}w1280${td.backdrop_path}`:poster;
  const desc  =td?.overview||item.plot||item.description||'Sem descrição disponível.';
  const year  =(item.year||item.releaseDate||td?.release_date||td?.first_air_date||'').toString().slice(0,4);
  const rating=item.rating_5based?(item.rating_5based*2).toFixed(1):(td?.vote_average?.toFixed(1)||item.rating||'');
  const genre =item.genre||'';

  document.getElementById('m-bg').src=back;
  document.getElementById('m-poster').src=poster;
  document.getElementById('m-title').textContent=title;
  document.getElementById('m-meta').innerHTML=
    `${rating?`<span class="star">⭐ ${rating}</span>`:''}
     ${year?`<span>${year}</span>`:''}
     ${genre?`<span>${genre}</span>`:''}
     <span>${isM?'Filme':'Série'}</span>`;
  document.getElementById('m-desc').textContent=desc;

  const epDiv=document.getElementById('m-eps');
  if (isM) {
    epDiv.innerHTML=`<button class="btn-red" style="width:100%;justify-content:center;font-size:14px;"
      onclick="openVODPlayer(ST.curItem,1,1,0)">▶ Assistir Agora</button>`;
  } else {
    epDiv.innerHTML='<div class="loader"><div class="spin"></div></div>';
    const sid=item.series_id;
    const info=await xcFetch('get_series_info',`&series_id=${sid}`);
    const eps=info?.episodes||{};
    const seasons=Object.keys(eps).sort((a,b)=>+a-+b);
    item._eps=eps;
    if (!seasons.length) {
      epDiv.innerHTML=`<button class="btn-red" style="width:100%;justify-content:center;"
        onclick="openVODPlayer(ST.curItem,1,1,0)">▶ Assistir</button>`;
    } else {
      epDiv.innerHTML=`
        <div class="shd">TEMPORADAS & EPISÓDIOS</div>
        <div class="stabs">${seasons.map((s,i)=>
          `<button class="stab${i===0?' on':''}" onclick="showSeason('${s}',this)">${s}ª Temp.</button>`
        ).join('')}</div>
        <div class="egrid" id="egrid"></div>`;
      showSeason(seasons[0],epDiv.querySelector('.stab'));
    }
  }

  document.getElementById('modal').classList.add('open');
  document.body.style.overflow='hidden';
}

function showSeason(s,el) {
  document.querySelectorAll('.stab').forEach(b=>b.classList.remove('on'));
  if(el)el.classList.add('on');
  const eps=ST.curItem._eps?.[s]||[];
  document.getElementById('egrid').innerHTML=eps.map(ep=>`
    <div class="ep" onclick="openVODPlayer(ST.curItem,${+s},${ep.episode_num},0)">
      <div class="epn">${ep.episode_num}</div>
      <div class="ept">
        <div class="epname">${ep.title||`Episódio ${ep.episode_num}`}</div>
        <div class="epdate">${ep.info?.air_date||''}</div>
      </div>
      <span>▶</span>
    </div>`).join('')||'<div class="empty" style="grid-column:1/-1">Sem episódios.</div>';
}

function closeModal(){
  document.getElementById('modal').classList.remove('open');
  document.body.style.overflow='';
}
document.getElementById('modal').addEventListener('click',e=>{
  if(e.target===document.getElementById('modal'))closeModal();
});

/* ══════════════════════════════════════
   PLAYER VOD
══════════════════════════════════════ */
async function openVODPlayer(item,s,e,si=0){
  ST.curItem=item; ST.curS=s; ST.curE=e; ST.curSrv=si;
  const isM=item._type==='movie';
  const title=item.name||item.title||'';

  document.getElementById('ptitle').textContent=isM?title:`${title} — T${s}E${e}`;
  document.getElementById('pspin').className='spin lg';
  document.getElementById('ploadtxt').textContent='Carregando...';
  document.getElementById('ptip').textContent='Se não carregar, tente outro servidor. Servidores com borda verde 🇧🇷 têm PT.';

  // Busca IDs TMDB/IMDB
  let tmdbId=item._td?.id||null;
  let imdbId=item._imdb||null;
  if (!tmdbId && !imdbId) {
    // Sem IDs — usa stream direto do servidor XC via player HLS
    const url=isM?movieUrl(item.stream_id):seriesUrl(item.stream_id);
    document.getElementById('psrv').innerHTML=
      `<span class="pslabel">Stream Direto:</span><span style="font-size:12px;color:var(--muted)">${title}</span>`;
    setFrame(`https://www.hlsplayer.org/play?url=${encodeURIComponent(url)}`);
    openPlayer();
    closeModal();
    return;
  }
  if (!imdbId && tmdbId) {
    imdbId=await getImdb(tmdbId, isM?'movie':'tv')||'';
    item._imdb=imdbId;
  }

  document.getElementById('psrv').innerHTML=
    `<span class="pslabel">Servidor:</span>
     <div class="sbtns">${VOD_SRVS.map((sv,i)=>
       `<button class="sbtn${i===si?' on':''}${sv.pt?' pt':''}" onclick="switchVODSrv(${i})">${sv.n}</button>`
     ).join('')}</div>`;

  loadVODEmbed(item,s,e,si,tmdbId,imdbId);
  openPlayer();
  closeModal();
}

function switchVODSrv(i){
  ST.curSrv=i;
  document.querySelectorAll('.sbtn').forEach((b,j)=>b.classList.toggle('on',j===i));
  const it=ST.curItem;
  loadVODEmbed(it,ST.curS,ST.curE,i,it._td?.id,it._imdb);
}

function loadVODEmbed(item,s,e,si,tid,iid){
  const t=item._type==='movie'?'m':'s';
  const url=VOD_SRVS[si].f(t,tid,iid||tid,s,e);
  setFrame(url);
}

/* ══════════════════════════════════════
   AO VIVO
══════════════════════════════════════ */
async function loadLive(){
  const grid=document.getElementById('live-grid');
  grid.innerHTML='<div class="loader" style="grid-column:1/-1"><div class="spin g"></div><span>Carregando canais...</span></div>';

  const [cats,streams]=await Promise.all([
    xcFetch('get_live_categories'),
    xcFetch('get_live_streams')
  ]);
  ST.liveCats=Array.isArray(cats)?cats:[];
  ST.liveChs=Array.isArray(streams)?streams:[];
  ST.liveFiltered=ST.liveChs;

  renderLiveCats();
  renderLiveGrid(ST.liveChs);
}

function renderLiveCats(){
  document.getElementById('live-cats').innerHTML=
    `<button class="pill live-p lon" onclick="filterLiveCat(null,this)">Todos (${ST.liveChs.length})</button>`+
    ST.liveCats.map(c=>
      `<button class="pill live-p" onclick="filterLiveCat('${c.category_id}',this)">${c.category_name}</button>`
    ).join('');
}

function filterLiveCat(id,el){
  ST.liveCatId=id;
  document.querySelectorAll('#live-cats .pill').forEach(b=>b.classList.remove('lon'));
  if(el)el.classList.add('lon');
  const f=id?ST.liveChs.filter(c=>c.category_id===id):ST.liveChs;
  ST.liveFiltered=f;
  document.getElementById('lsrch').value='';
  renderLiveGrid(f);
}

function renderLiveGrid(chs){
  const grid=document.getElementById('live-grid');
  document.getElementById('live-cnt').textContent=chs.length?`(${chs.length})`:'';
  if(!chs.length){grid.innerHTML='<div class="empty" style="grid-column:1/-1">Nenhum canal.</div>';return;}
  grid.innerHTML=chs.map((ch,i)=>{
    const logo=ch.stream_icon;
    const logoEl=logo
      ?`<img class="ch-logo" src="${logo}" alt="${ch.name}" loading="lazy"
          onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">
        <div class="ch-ph" style="display:none">📺</div>`
      :`<div class="ch-ph">📺</div>`;
    return `<div class="ch" onclick="playLive(${i})">
      ${logoEl}
      <div class="ch-info">
        <div class="ch-name">${ch.name}</div>
        <div class="ch-cat">${ch.category_name||''}</div>
      </div>
      <span class="ch-arr">▶</span>
    </div>`;
  }).join('');
}

function playLive(i){
  const ch=ST.liveFiltered[i];
  if(!ch)return;
  ST.curCh=ch;

  document.getElementById('ptitle').textContent=`📡 ${ch.name}`;
  document.getElementById('pspin').className='spin lg g';
  document.getElementById('ploadtxt').textContent='Conectando ao canal...';
  document.getElementById('ptip').textContent='Se travar, tente outro player.';

  const base=liveUrl(ch.stream_id);

  document.getElementById('psrv').innerHTML=
    `<span class="pslabel">Player:</span>
     <div class="sbtns">${LIVE_SRVS.map((sv,i)=>
       `<button class="sbtn live-s${i===0?' lon':''}" onclick="switchLiveSrv(${i})">${sv.n}</button>`
     ).join('')}</div>`;

  setFrame(LIVE_SRVS[0].f(base));
  openPlayer();
}

function switchLiveSrv(i){
  document.querySelectorAll('.sbtn').forEach((b,j)=>b.classList.toggle('lon',j===i));
  setFrame(LIVE_SRVS[i].f(liveUrl(ST.curCh.stream_id)));
}

/* ══════════════════════════════════════
   PLAYER GENÉRICO
══════════════════════════════════════ */
function setFrame(url){
  const load=document.getElementById('ploading');
  const frame=document.getElementById('pframe');
  load.classList.remove('gone');
  frame.src='';
  frame.onload=()=>setTimeout(()=>load.classList.add('gone'),900);
  setTimeout(()=>{frame.src=url;},180);
}
function openPlayer(){
  document.getElementById('player').classList.add('open');
  document.body.style.overflow='hidden';
}
function closePlayer(){
  document.getElementById('pframe').src='';
  document.getElementById('player').classList.remove('open');
  document.body.style.overflow='';
}

/* ══════════════════════════════════════
   BUSCA
══════════════════════════════════════ */
let stmr,ltmr;
document.getElementById('srch').addEventListener('input',function(){
  clearTimeout(stmr);
  const q=this.value.trim();
  if(!q){loadVODItems();return;}
  stmr=setTimeout(()=>loadVODItems(q),400);
});
document.getElementById('lsrch').addEventListener('input',function(){
  const q=this.value.toLowerCase().trim();
  renderLiveGrid(q?ST.liveFiltered.filter(c=>c.name.toLowerCase().includes(q)):ST.liveFiltered);
});

/* ══════════════════════════════════════
   INIT
══════════════════════════════════════ */
(async()=>{
  await loadVODCats();
  loadVODItems();
})();
</script>
